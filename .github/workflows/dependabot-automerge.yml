# Turns on auto-merge for Dependabot PRs, so they merge by themselves once the
# required CI "test" check passes. Major version bumps are left for a person:
# CI can't open the app, and a new Electron major can change behaviour.
# Needs, once: Settings > General > "Allow auto-merge", and a ruleset on main
# that requires the "test" check (see README, CI/CD).
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
